name: Semgrep

# Analyse statique de l'API PHP et du JavaScript des pages (06/10/2026).
# CodeQL (réglage « Default » du dépôt) ne lit pas le PHP : Semgrep le couvre.
# Jamais bloquant : les résultats vont dans l'onglet Security → Code scanning,
# à trier un par un (vraie faille, fausse alerte, risque accepté).
# Hebdomadaire en plus du push : les règles évoluent sans que le code change.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Détail des alertes dans le journal, SARIF pour l'onglet Security.
      # --timeout 60 : shared.js dépassait les 5 s par règle (mesuré le 06/10/2026).
      # vendor/ et xlsxstyle.js (SheetJS minifié) : bibliothèques, pas notre code. Tests et migration :
      # faux mots de passe et données d'essai, du bruit garanti.
      - name: Analyse
        run: >
          semgrep scan --metrics=off --timeout 60
          --config p/php --config p/javascript --config p/secrets
          --exclude vendor --exclude node_modules --exclude e2e
          --exclude api-tests --exclude migration --exclude '*.test.js' --exclude xlsxstyle.js
          --sarif-output=semgrep.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
