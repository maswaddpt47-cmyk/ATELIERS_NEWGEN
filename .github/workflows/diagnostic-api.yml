# Diagnostic du serveur Alwaysdata, lancé à la main (Actions → Run workflow).
# Claude n'a pas d'accès direct au serveur : ce job lui rapporte la version
# de PHP, les extensions utiles et les dernières erreurs PHP.
# N'affiche jamais ~/config-api.php. Les lignes de journal sont filtrées sur
# les erreurs PHP : pas de journal d'accès (adresses IP des usagers).
name: Diagnostic API Alwaysdata

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      # Accès SSH : clé (secret ALWAYSDATA_SSH_KEY) si elle existe, sinon mot de
      # passe (ALWAYSDATA_SSH_PASSWORD) — bascule sans coupure (29/09/2026).
      # Les étapes suivantes lancent « $VIA ssh … » / « $VIA rsync … ».
      - name: Préparer l'accès SSH
        env:
          CLE: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$CLE" ]; then
            printf '%s\n' "$CLE" | tr -d '\r' > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "VIA=" >> "$GITHUB_ENV"
            echo "::notice::Accès SSH par clé"
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "VIA=sshpass -e" >> "$GITHUB_ENV"
            echo "::notice::Accès SSH par mot de passe (clé absente)"
          else
            echo "::error::Ni ALWAYSDATA_SSH_KEY ni ALWAYSDATA_SSH_PASSWORD"
            exit 1
          fi

      - name: Interroger le serveur
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
          SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
        run: |
          $VIA ssh -o StrictHostKeyChecking=accept-new "$COMPTE@ssh-$COMPTE.alwaysdata.net" '
            echo "== php (ligne de commande)"; php -v | head -1
            php -m | grep -iE "^(zip|simplexml|pdo_mysql|mbstring|libxml)$" | tr "\n" " "; echo
            echo "== fichiers"; ls -la ~/config-api.php 2>&1 | cut -c1-40; ls ~/www/api ~/www/api/lib
            echo "== journaux récents"; find ~/admin/logs -type f -mmin -1440 2>/dev/null | head -20
            echo "== erreurs PHP (24 h)"
            find ~/admin/logs -type f -mmin -1440 2>/dev/null | xargs -r grep -hiE "PHP (Fatal|Parse|Warning|Notice)|Uncaught|Allowed memory|Maximum execution" 2>/dev/null | tail -30
            echo "== apache.log (20 dernières lignes, adresses IP masquées)"
            tail -20 ~/admin/logs/apache/apache.log 2>/dev/null | sed -E "s/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/x.x.x.x/g; s/[0-9a-f]*:[0-9a-f:]{6,}/x::x/g"
            echo "== copies de nuit (~/sauvegardes : noms, tailles, dates — jamais le contenu)"
            ls -l --time-style=+%F_%T ~/sauvegardes 2>&1 | awk "{print \$5, \$6, \$7}"
            echo "== sauvegardes Alwaysdata (~/admin/backup)"
            ls -l --time-style=+%F_%T ~/admin/backup 2>&1 | awk "{print \$6, \$7}" | head -20
            echo "== dossiers de journaux"
            find ~/admin/logs -maxdepth 2 -type d 2>/dev/null | head -20
            echo "== traces de la tâche planifiée (lignes « sauvegarde », 48 h)"
            find ~/admin/logs -type f -mmin -2880 2>/dev/null | xargs -r grep -h "sauvegarde" 2>/dev/null | grep -v "GET \|POST " | tail -15
            echo "== heure du serveur"; date
            echo "== appels à import.php (requête, code, taille — sans IP)"
            cat ~/admin/logs/http/2026/http-2026-09-2*.log 2>/dev/null | grep "import.php" | grep -oE "\[[^]]+\] \"[A-Z]+ [^ ]+ [^\"]+\" [0-9]{3} [0-9-]+" | tail -20
          '
