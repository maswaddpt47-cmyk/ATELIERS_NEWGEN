name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Documentation seule (CHANTIERS, CLAUDE, AGORA…) : rien à publier ni à
    # retester. Un push qui mêle .md et code se déploie normalement.
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests utils
        run: node --test utils.test.js

      - name: Tests logic
        run: node --test logic.test.js

      - name: Tests contrat
        run: node --test contract.test.js

      # Cadence du veilleur d'intégrité (AG-039) : script réel, faux gh, aucune attente.
      - name: Tests veilleur
        run: node --test veilleur.test.js

      # Requête-témoin du contrôle d'intégrité (AG-039) : scripts réels, faux curl, faux journaux.
      - name: Tests intégrité
        run: node --test integrite.test.js

      # Alerte « copie trop vieille » (24/11/2026) : script réel, horloge figée, dates fictives.
      - name: Tests fraîcheur des copies
        run: node --test fraicheur.test.js

      - name: Garde-fou cache-busting
        run: node scripts/check-cache-busting.js "${{ github.event.before }}" "${{ github.sha }}"

      # RGPD : le dépôt est public. Aucun export de données (classeur, copie
      # de base, CSV) ni fichier d'identifiants ne doit jamais y entrer ;
      # seul le schéma vide de la base est admis.
      - name: "[RGPD-14] Garde-fou RGPD — aucun fichier de données dans le dépôt"
        run: |
          interdits=$(git ls-files | grep -iE '\.(xlsx|xlsm|xls|ods|csv|sql|sql\.gz|gz|age|dump|bak)$|(^|/)config-api\.php$' | grep -vx 'api/lib/schema.sql' || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichier(s) de données ou d'identifiants dans le dépôt public :"
            echo "$interdits"
            exit 1
          fi

      # Aucune ressource tierce chargée par les pages (bibliothèques dans
      # vendor/ depuis le 25/09/2026) : un CDN verrait l'adresse IP de chaque
      # agent à chaque ouverture et pourrait servir un script modifié.
      - name: "[RGPD-17] Aucune ressource externe dans les pages"
        run: |
          # Toutes les pages publiées, pas seulement index/admin : une ancienne
          # page oubliée (admin_v14.html, relevée par l'audit du 01/10/2026)
          # échappait au contrôle.
          pages=$(git ls-files '*.html' ':!vendor/**' ':!node_modules/**')
          externes=$(grep -noE '(src|href)="(https?:)?//[^"]+' $pages || true)
          if [ -n "$externes" ]; then
            echo "::error::Ressource externe chargée par une page :"
            echo "$externes"
            exit 1
          fi

  # Charge réellement index.html et admin.html dans Chromium et clique chaque
  # onglet. Les suites Node ne testent que des fonctions pures : elles passent
  # même si shared.js lève une erreur au chargement et laisse les deux pages
  # blanches. Ce job est le seul à voir ce genre de casse.
  e2e:
    # En parallèle de test (15/11/2026) : deploy attend déjà les deux, aucun contrôle retiré.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      # sandbox, smoke (tous les onglets), réseau (plafonds, reprises,
      # doublage), appels (nombre d'appels émis) — un seul lancement, en
      # parallèle (26/09/2026 : ~140 s en série → ~45 s).
      - name: Tests navigateur (Playwright)
        run: npx playwright test
        env:
          CI: 'true'


  deploy:
    needs: [test, e2e]
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version publiée de chaque page (bandeau « nouvelle version », shared.js
      # verifierPagePerimee, 16/11/2026) : les scripts ?v= de index.html et
      # admin.html, lus par la page hors cache. Jamais commité (.gitignore).
      - name: Écrire version.json
        run: node scripts/version-json.js > version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # GitHub peut mettre quelques secondes à lister l'artefact qu'il vient de
      # recevoir : deploy-pages le cherche une seule fois, 0,3 s après l'envoi,
      # et échoue (« No artifacts named github-pages », 25/11/2026). On attend
      # donc qu'il soit visible (60 s au plus) ; sans réponse, on tente quand même.
      - name: Attendre l'artefact Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$n" -ge 1 ]; then echo "Artefact visible (essai $i)"; exit 0; fi
            echo "Artefact pas encore visible (essai $i)"; sleep 5
          done
          echo "Artefact non visible après 60 s : on tente le déploiement quand même."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
