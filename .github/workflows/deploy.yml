name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Documentation seule (CHANTIERS, CLAUDE, AGORA…) : rien à publier ni à
    # retester. Un push qui mêle .md et code se déploie normalement.
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests utils
        run: node --test utils.test.js

      - name: Tests logic
        run: node --test logic.test.js

      - name: Tests contrat
        run: node --test contract.test.js

      - name: Garde-fou cache-busting
        run: node scripts/check-cache-busting.js "${{ github.event.before }}" "${{ github.sha }}"

      # RGPD : le dépôt est public. Aucun export de données (classeur, copie
      # de base, CSV) ni fichier d'identifiants ne doit jamais y entrer ;
      # seul le schéma vide de la base est admis.
      - name: "[RGPD-14] Garde-fou RGPD — aucun fichier de données dans le dépôt"
        run: |
          interdits=$(git ls-files | grep -iE '\.(xlsx|xlsm|xls|ods|csv|sql|sql\.gz|gz|age|dump|bak)$|(^|/)config-api\.php$' | grep -vx 'api/lib/schema.sql' || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichier(s) de données ou d'identifiants dans le dépôt public :"
            echo "$interdits"
            exit 1
          fi

      # Aucune ressource tierce chargée par les pages (bibliothèques dans
      # vendor/ depuis le 25/09/2026) : un CDN verrait l'adresse IP de chaque
      # agent à chaque ouverture et pourrait servir un script modifié.
      - name: "[RGPD-17] Aucune ressource externe dans les pages"
        run: |
          externes=$(grep -noE '(src|href)="(https?:)?//[^"]+' index.html admin.html || true)
          if [ -n "$externes" ]; then
            echo "::error::Ressource externe chargée par une page :"
            echo "$externes"
            exit 1
          fi

  # Charge réellement index.html et admin.html dans Chromium et clique chaque
  # onglet. Les suites Node ne testent que des fonctions pures : elles passent
  # même si shared.js lève une erreur au chargement et laisse les deux pages
  # blanches. Ce job est le seul à voir ce genre de casse.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sandbox navigateur (utils + logic)
        run: node sandbox.test.js

      - name: Tests e2e (index + admin, tous les onglets)
        run: node e2e.test.js

      - name: Politique d'appel GAS (plafonds, reprises, doublage)
        run: node reseau.test.js

      - name: Appels GAS superflus (ouverture, écriture)
        run: node appels.test.js

      - name: Labo NextStep (branché sur l'API, jamais sur le GAS)
        run: node labo-nextstep.test.js

  deploy:
    needs: [test, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
