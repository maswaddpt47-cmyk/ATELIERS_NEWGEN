name: Parité NEWGEN / NextStep

# AG-015 (tranché le 26/09/2026) : compare le code exécuté par les pages des
# deux applis. Séparé de deploy.yml exprès — jamais bloquant pour la mise en
# ligne : un échec ici envoie l'alerte mail de GitHub, rien de plus.
# Quotidien en plus du push : un changement poussé sur NextStep ne déclenche
# rien ici.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Un push plus récent remplace le contrôle en attente : une seule alerte.
concurrency:
  group: parite
  cancel-in-progress: true

jobs:
  parite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: NextStep
        uses: actions/checkout@v4
        with:
          repository: maswaddpt47-cmyk/ateliers-cd47_NextStep
          path: nextstep

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: acorn
        run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Sur un push, laisser le temps de porter le changement sur NextStep
      # (04/10/2026 : quatre alertes le même jour, toutes levées quelques
      # minutes plus tard par le portage) : deux nouveaux essais, 10 min
      # d'écart, NextStep relu à chaque fois. L'alerte ne part que si l'écart
      # dure plus de 20 min. Le contrôle quotidien, lui, échoue tout de suite.
      - name: Comparaison
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          essais=1; [ "$EVENEMENT" = push ] && essais=3
          for i in $(seq 1 $essais); do
            if node scripts/parite.js nextstep; then exit 0; fi
            [ "$i" = "$essais" ] && exit 1
            echo "Écart constaté, nouvel essai dans 10 min (portage NextStep en cours ?)"
            sleep 600
            git -C nextstep fetch -q --depth=1 origin HEAD && git -C nextstep reset -q --hard FETCH_HEAD
          done
